services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      SAFEOPS_EXECUTION_MODE: simulate
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    image: node:22-slim
    working_dir: /app
    command: >
      sh -c "npm install &&
             npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_SAFEOPS_API: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
